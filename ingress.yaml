                  number: 80

          - path: /BaseApparelComingSoon
            pathType: Prefix
            backend:
              service:
                name: base-apparel-coming-soon
                port:
                  number: 80

          - path: /ArticlePreviewComponent
            pathType: Prefix
            backend:
              service:
                name: article-preview-component
                port:
                  number: 80

          - path: /SaasLandingPage
            pathType: Prefix
            backend:
              service:
                name: saas-landing-page
                port:
                  number: 80

          - path: /PingComingSoonPage
            pathType: Prefix
            backend:
              service:
                name: ping-coming-soon-page
                port:
                  number: 80

          - path: /SocialLinksProfile
            pathType: Prefix
            backend:
              service:
                name: social-links-profile-main
                port:
                  number: 80

          - path: /contact-book
            pathType: Prefix
            backend:
              service:
                name: contact-book
                port:
                  number: 80

          - path: /IntroComponentWithSignupForm
            pathType: Prefix
            backend:
              service:
                name: intro-component-with-signup-form
                port:
                  number: 80

          # ===== API =====
          - path: /api/cartoons
            pathType: Prefix
            backend:
              service:
                name: cartoonapi-service
                port:
                  number: 80

          - path: /api/send
            pathType: Prefix
            backend:
              service:
                name: mailer-service
                port:
                  number: 80

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: mongo-auth-service
                port:
                  number: 80

          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: mongo-auth-service
                port:
                  number: 80

          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: mongo-auth-service
                port:
                  number: 80

  tls:
    - hosts:
        - mmalabugin.ru
      secretName: main-page-tls
